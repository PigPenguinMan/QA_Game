<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>슬라임 사냥 - QA 연습용</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e8f1ee;--ink:#1f2d2a;--card:#fbfdfc;--accent:#1d6b5c;--warn:#b8860b;--bad:#b23a3a;--line:#b9cfc8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201d;--ink:#e3efeb;--card:#1c2c28;--accent:#5cc4ad;--warn:#e0b341;--bad:#e27a7a;--line:#34504a}}
:root[data-theme="dark"]{--bg:#14201d;--ink:#e3efeb;--card:#1c2c28;--accent:#5cc4ad;--warn:#e0b341;--bad:#e27a7a;--line:#34504a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:460px;margin:0 auto;padding:24px 16px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 16px;opacity:.7;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{font-size:.95rem}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.e i{background:var(--bad)}
button{font:inherit;cursor:pointer;color:var(--bg);background:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;font-weight:600}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
ul{list-style:none;margin:0;padding:0;max-height:200px;overflow-y:auto}
li{padding:4px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
#state{font-weight:700;margin:0 0 8px}
</style>
</head>
<body>
<main>
<h1>슬라임 사냥</h1>
<p class="sub">QA 연습용. 전투, 아이템, 상점, 성장 시스템을 테스트해 보세요.</p>

<div class="card">
  <div class="grid">
    <div class="stat">레벨 <b id="lv"></b> · EXP <b id="exp"></b>/100</div>
    <div class="stat">골드 <b id="gold"></b> · 포션 <b id="potion"></b></div>
    <div class="stat">HP <b id="hp"></b>/<b id="mhp"></b><div class="bar"><i id="hpb"></i></div></div>
    <div class="stat">MP <b id="mp"></b>/30<div class="bar"><i id="mpb"></i></div></div>
  </div>
</div>

<div class="card">
  <p id="state" role="status"></p>
  <div class="stat">슬라임 HP <b id="ehp"></b>/60<div class="bar e"><i id="ehpb"></i></div></div>
</div>

<div class="card">
  <div class="grid">
    <button id="atk">공격 (10~15)</button>
    <button id="skill">스킬 (MP 10, 25)</button>
    <button id="def">방어</button>
    <button id="pot">포션 (HP +30)</button>
    <button id="buy" class="ghost">포션 구매 (15G)</button>
    <button id="next" class="ghost">새 전투 / 재시작</button>
  </div>
</div>

<div class="card"><ul id="log"></ul></div>
</main>

<script>
const $ = id => document.getElementById(id);
let p, e, defending, over;

function init(){
  p = {lv:1, exp:0, gold:10, potion:3, hp:100, mhp:100, mp:30};
  newBattle(true);
}
function newBattle(first){
  e = {hp:60};
  over = false;
  if(!first && p.hp <= 0){ p.hp = p.mhp; p.mp = 30; }   // 패배 후 재시작
  // 방어 상태는 초기화하지 않음
  $('state').textContent = '야생 슬라임이 나타났다!';
  if(first) $('log').innerHTML='';
  log('전투 시작');
  render();
}
function log(t){ const li=document.createElement('li'); li.textContent=t; $('log').prepend(li); }
function render(){
  $('lv').textContent=p.lv; $('exp').textContent=p.exp; $('gold').textContent=p.gold; $('potion').textContent=p.potion;
  $('hp').textContent=p.hp; $('mhp').textContent=p.mhp; $('mp').textContent=p.mp; $('ehp').textContent=e.hp;
  $('hpb').style.width=Math.max(0,p.hp/p.mhp*100)+'%';
  $('mpb').style.width=Math.max(0,p.mp/30*100)+'%';
  $('ehpb').style.width=Math.max(0,e.hp/60*100)+'%';
}

function enemyTurn(){
  let dmg = 8 + Math.floor(Math.random()*7);   // 8~14
  if(defending) dmg = Math.floor(dmg/2);       // 방어 해제 처리 없음
  p.hp -= dmg;
  log('슬라임의 공격! '+dmg+' 피해');
  if(p.hp <= 0){ $('state').textContent='패배...'; log('패배했습니다.'); over = true; }
}

function checkWin(){
  if(e.hp <= 0){
    $('state').textContent='승리!';
    p.gold += 20; p.exp += 30;
    log('슬라임 처치! 골드 +20, EXP +30');
    if(p.exp > 100){                           // 정확히 100이면 레벨업 안 됨
      p.lv++; p.exp = 0; p.mhp += 10;           // 초과 EXP 버려짐
      log('레벨 업! Lv.'+p.lv);
    }
    over = true;
  }
}

function act(fn){
  if(over){ log('전투가 끝났습니다. 새 전투를 시작하세요.'); return; }
  fn();
  checkWin();
  enemyTurn();                                  // 적이 죽어도 반격함
  render();
}

$('atk').onclick = () => act(() => {
  const d = 10 + Math.floor(Math.random()*6);
  e.hp -= d; log('공격! '+d+' 피해');
});
$('skill').onclick = () => act(() => {
  if(p.mp <= 0){ log('MP가 부족합니다.'); return; }   // MP 10 미만이어도 사용 가능
  p.mp -= 10;
  e.hp -= 20;
  log('스킬 발동! 25 피해');                          // 로그와 실제 피해 불일치
});
$('def').onclick = () => act(() => { defending = true; log('방어 자세'); });
$('pot').onclick = () => act(() => {
  p.potion--;                                         // 개수 검사 없음
  p.hp += 30;                                         // 최대 HP 초과 가능
  log('포션 사용! HP +30');
});
$('buy').onclick = () => {
  if(p.gold > 15){ p.gold -= 15; p.potion++; log('포션 구매'); }  // 정확히 15G면 구매 불가
  else log('골드가 부족합니다.');
  render();
};
$('next').onclick = () => { if(p.hp <= 0){ init(); } else newBattle(false); };

init();
</script>
</body>
</html>
